# Organigrama 2026 de IEEE UP, transcrito de
# 02-ARQUITECTURA-WEB-IEEE-UP/03-organigrama-2026-y-modelo-de-datos.md
#
# Regla de privacidad (no negociable, ver ese archivo seccion 6): NUNCA agregar
# aqui el ID de miembro (P000xxxxxx), genero, ni facultad/carrera. Solo nombre
# y cargo/rol.
#
# Regla de fotos (02-wireframe-home-y-paginas-clave.md): con foto solo el
# Directorio (14) y la presidencia de cada Grupo de Afinidad (3). El resto,
# nombre + rol sin foto. Por eso `foto` se deja vacio por defecto: se completa
# a mano cuando exista una fotografia real (nunca placeholder generico).

# `mesa: true` marca a los oficiales que IEEE pide reportar en vTools
# (presidencia, vicepresidencia, secretaria, tesoreria y webmaster). Es lo
# que muestran la portada y la cabecera de Nosotros. Antes esos bloques
# cortaban la lista con `directorio[:3]`, asi que dependian del ORDEN del
# archivo: mover una fila cambiaba en silencio quien salia publicado.
directorio:
  - { nombre: "Madisson Ivette Ramos Granda", cargo: "Presidenta", foto: "img/personas/madisson-ramos.jpg", mesa: true }
  - { nombre: "Ana Gabriela Molina Zamalloa", cargo: "Vicepresidenta", foto: "img/personas/ana-molina.jpg", mesa: true }
  # Tambien dirige el area de Recursos Humanos (ver `areas` mas abajo);
  # en la mesa directiva figura por su cargo de secretaria.
  - { nombre: "Gady Letizia Taza Lopez", cargo: "Secretaria", foto: "img/personas/gady-taza.jpg", mesa: true }
  - { nombre: "Juliana Esther Bautista Espino", cargo: "Tesorera", foto: "img/personas/juliana-bautista.jpg", mesa: true }
  - { nombre: "Jhoan Leandro Vargas Collas", cargo: "Webmaster", foto: "img/personas/jhoan-vargas.jpg", mesa: true }
  - { nombre: "Marietha Kristeen Alexandra Cordova Delgado", cargo: "Directora de Investigación", foto: "" }
  - { nombre: "Flavia Fernanda De Fatima Chirinos Molinero", cargo: "Co-Directora de Innovación (Emprendimiento)", foto: "" }
