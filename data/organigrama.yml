  - { nombre: "Pathy Tuero Tuero Culqui", cargo: "Directora de Desarrollo", foto: "" }
  - { nombre: "Johao Rafael Mendoza Fabian", cargo: "Codirector de Desarrollo", foto: "" }
  - { nombre: "Jazmin Melina Gonzales Ubia", cargo: "Directora de Eventos", foto: "" }
